[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sciona-infra"
version = "0.1.0"
description = "Sciona website, API, workflows, and infrastructure stack"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "supabase>=2.0",
    "openai>=1.0.0",
    "httpx>=0.27",
    "boto3>=1.34",
    "stripe>=7.0",
    "temporalio>=1.5",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "sentry-sdk[fastapi]>=2.0",
    "neo4j>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sse-starlette>=2.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "asyncpg>=0.29",
]

[tool.hatch.build.targets.sdist]
include = ["sciona_infra/", "pyproject.toml", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["sciona_infra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "supabase_local: exercises the live local Supabase/runtime stack",
]
